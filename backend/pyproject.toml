[project]
name = "mcn-backend"
version = "0.1.0"
description = "MCN CRM Backend — Django + django-ninja auf dem PostgreSQL-first Schema"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6",
    "django-ninja>=1.3",
    "psycopg[binary]>=3.2",
    "django-cors-headers>=4.4",
    "fpdf2>=2.8.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
