<nav class="reiter" aria-label="Mein Bereich">
  @if (darfStempeln()) {
    <a
      class="reiter__link"
      routerLink="zeiten"
      routerLinkActive="reiter__link--aktiv"
      #zeiten="routerLinkActive"
      [attr.aria-current]="zeiten.isActive ? 'page' : null"
    >
      Meine Zeiten
    </a>
  }
  @if (darfLesen()) {
    <a
      class="reiter__link"
      routerLink="verlauf"
      routerLinkActive="reiter__link--aktiv"
      #verlauf="routerLinkActive"
      [attr.aria-current]="verlauf.isActive ? 'page' : null"
    >
      Mein Verlauf
    </a>
  }
  <a
    class="reiter__link"
    routerLink="personalakte"
    routerLinkActive="reiter__link--aktiv"
    #akte="routerLinkActive"
    [attr.aria-current]="akte.isActive ? 'page' : null"
  >
    Personalakte &amp; Anträge
  </a>
</nav>

<router-outlet />
