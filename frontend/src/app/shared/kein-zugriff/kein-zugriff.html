<div class="sperr note" role="alert">

    <span class="sperr__glyph" aria-hidden="true">◇</span>
    Zugriff · verweigert
  </p>

  <p class="note__text">
    Für diesen Bereich fehlt Ihrem Konto die Berechtigung. Wenden Sie sich an die

    <a class="btn btn--primary" routerLink="/uebersicht">Zur Übersicht</a>
  </div>
