<section class="platz" aria-labelledby="platz-titel">
  <p class="platz__kicker">
    <span class="platz__scale" aria-hidden="true"></span>
    Bereich im Aufbau
  </p>
  <h1 id="platz-titel" class="platz__titel">{{ data().titel }}</h1>
  <p class="platz__text">{{ data().text }}</p>

  <div class="platz__blueprint" aria-hidden="true">
    <span class="bp__tick" style="--i: 0"></span>
    <span class="bp__tick" style="--i: 1"></span>
    <span class="bp__tick" style="--i: 2"></span>
    <span class="bp__tick" style="--i: 3"></span>
    <span class="bp__tick" style="--i: 4"></span>
    <span class="bp__label">geplant</span>
  </div>
</section>
